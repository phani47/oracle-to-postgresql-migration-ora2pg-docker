# Oracle Connection
ORACLE_DSN    dbi:Oracle:host=oracle-free;port=1521;service_name=freepdb1
ORACLE_USER   HR

# Source Schema
SCHEMA        HR

# Target PostgreSQL Version
PG_VERSION    18

# Export Type
TYPE          TABLE

# PostgreSQL Compatibility
PG_NUMERIC_TYPE         1
PG_INTEGER_TYPE         1

# Include Constraints
FKEY_DEFERRABLE         0

# Export Behavior
DROP_IF_EXISTS          0

# User Privileges
USER_GRANTS             1
